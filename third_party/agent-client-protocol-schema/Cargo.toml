# VENDORING NOTES — `agent-client-protocol-schema` 0.11.4 (Apache-2.0).
# Pinned by `[patch.crates-io]` in the workspace root. Upstream:
# https://github.com/agentclientprotocol/agent-client-protocol (rust-sdk).
#
# WHY VENDORED: `agent-client-protocol` 0.10.4 serializes its responses from
# these types, and the structs carry no catch-all field — so an agent cannot
# add a top-level key to `session/new` / `session/load` / `session/resume`
# results. Hosts in this ecosystem read exactly that: the OpenDesign daemon
# persists its resume handle from `result.openCodeSessionId` (absent here, so
# every run fell back to a cold session) and requires `result.sessionId` on a
# load. Both now ride `extra` (see the LOCAL PATCH notes in `src/agent.rs`).
#
# LOCAL PATCH (only divergence from the published crate):
#   src/agent.rs — `#[serde(flatten)] pub extra: Meta` plus an `extra(key,
#   value)` builder on `NewSessionResponse`, `LoadSessionResponse` and
#   `ResumeSessionResponse`. Unknown keys land in `extra` on deserialize and
#   are emitted inline on serialize; the empty map serializes as nothing, so
#   strict clients are unaffected.
#
# UPGRADE CHECKLIST (when bumping `agent-client-protocol`):
#   1. Re-vendor the matching `agent-client-protocol-schema` version (the
#      crate pins it with `=`, so versions must match exactly).
#   2. Re-apply the LOCAL PATCH to the three response structs.
#   3. Keep the workspace root `[patch.crates-io]` entry pointing here.
#   4. `cargo test -p xai-grok-shell -- acp_session_response_wire_shape` pins
#      the emitted keys and fails loudly if the patch is dropped.

