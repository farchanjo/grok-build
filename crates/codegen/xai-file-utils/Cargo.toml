[package]
license = "Apache-2.0"
name = "xai-file-utils"
version = "0.1.0"
edition.workspace = true
description = "Local data collection: per-turn event tracking"
authors = ["xAI"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64.workspace = true
bytes = { workspace = true }
dunce = { workspace = true }
xai-circuit-breaker = { workspace = true }
# `[assets]` / `[assets_providers.*]` schema. Config types only; no credentials.
xai-grok-config-types = { workspace = true }
xai-grok-version = { workspace = true }
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
] }
aws-config = { version = "1", default-features = false, features = [
    "rt-tokio",
    "sso",
    "credentials-process",
] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
indexmap = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "fs"] }
sha2 = { workspace = true, features = ["force-soft"] }
xai-grok-auth = { path = "../xai-grok-auth", features = ["middleware"] }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
async-compression = { workspace = true, features = ["tokio"] }
# The workspace entry sets `default-features = false`, which leaves `rustls-tls`
# off: every https request through gcloud-storage then fails at connect time
# with "invalid URL, scheme is not http". The asset GCS adapter is the first
# caller to actually make one, so opt the feature back in here.
gcloud-storage = { workspace = true, features = ["rustls-tls"] }
opentelemetry = { workspace = true }
reflink-copy = { workspace = true }
tracing-opentelemetry = { workspace = true }
url = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
zstd.workspace = true


[features]
default-bazel = []
# Exposes `assets::MockAssetStore` (and its builder) to downstream crates that
# need an in-memory `AssetStore` seam in their own tests.
test-support = []


[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "net", "time"] }
xai-test-utils = { workspace = true }
filetime = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
