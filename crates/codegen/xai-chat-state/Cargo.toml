[package]
license = "Apache-2.0"
name = "xai-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for xAI agents"

[features]
default-bazel = []

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
hex = "0.4"
indexmap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
xai-grok-compaction = { path = "../../common/xai-grok-compaction" }
xai-grok-inference-types = { path = "../xai-grok-inference-types" }
xai-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
