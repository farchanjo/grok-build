[package]
license = "Apache-2.0"
name = "xai-grok-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the grok CLI, extracted from xai-grok-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
xai-grok-config = { workspace = true }
# Deliberately NOT `xai-grok-mcp`: that crate depends on `xai-file-utils`, so
# depending on it here would make `xai-file-utils -> xai-grok-config-types ->
# xai-grok-mcp -> xai-file-utils` a cyclic package dependency. `McpOAuthConfig`
# moved into `src/mcp.rs` and is re-exported from `xai_grok_mcp::oauth_config`.

[dev-dependencies]
toml = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
