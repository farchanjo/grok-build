[package]
name = "archanjo"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Archanjo custom tool pack for Grok Build (out-of-tree tools, modular registration)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
xai-tool-runtime = { workspace = true }
xai-tool-protocol = { workspace = true }
xai-tool-types = { workspace = true }
xai-grok-tools = { path = "../xai-grok-tools" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
