[build]
# Resolve through PATH so Homebrew and other sccache installations work.
rustc-wrapper = "sccache"

# link-arg
# https://pyo3.rs/v0.17.1/building_and_distribution.html#macos

# force-unwind-tables
# https://github.com/rust-lang/backtrace-rs/issues/397

# rustflags are not additive. we have differing flags per arch,
# so we must repeat flags in each target section

[target.x86_64-apple-darwin]
rustflags = [
    "-C",
    "link-arg=-undefined",
    "-C",
    "link-arg=dynamic_lookup",
    "-C",
    "force-unwind-tables=yes",
    "-C",
    "link-args=-ObjC",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C",
    "link-arg=-undefined",
    "-C",
    "link-arg=dynamic_lookup",
    "-C",
    "force-unwind-tables=yes",
    "-C",
    "link-args=-ObjC",
]

# Faster linker for GNU Linux hosts (lld). Requires `lld` on PATH (e.g.
# clang/lld package). Skipped on musl/release-hardening targets below.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "force-unwind-tables=yes",
    "-C", "link-arg=-fuse-ld=lld",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=neoverse-v2",
    "-C", "force-unwind-tables=yes",
    "-C", "link-arg=-fuse-ld=lld",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "force-unwind-tables=yes",
    # Binary hardening (SECURITY): Full RELRO + non-executable stack
    # These flags prevent: GOT overwrite attacks, lazy binding exploits, stack shellcode
    # IMPORTANT: If changing build system (e.g. from cargo to Bazel-only),
    # ensure equivalent linker hardening is applied to production binaries.
    "-C", "link-arg=-Wl,-z,relro,-z,now,-z,noexecstack",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "target-cpu=generic",
    "-C", "force-unwind-tables=yes",
    # Binary hardening (SECURITY): Full RELRO + non-executable stack
    # These flags prevent: GOT overwrite attacks, lazy binding exploits, stack shellcode
    # IMPORTANT: If changing build system (e.g. from cargo to Bazel-only),
    # ensure equivalent linker hardening is applied to production binaries.
    "-C", "link-arg=-Wl,-z,relro,-z,now,-z,noexecstack",
]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "force-unwind-tables=yes", "-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "force-unwind-tables=yes", "-C", "target-feature=+crt-static"]


# jemalloc page size for Apple Silicon (macOS aarch64 uses 16KB pages = 2^14).
# This target-prefixed env var is consumed by tikv-jemalloc-sys's build.rs
# and only takes effect when TARGET=aarch64-apple-darwin. Other targets
# (x86_64, linux) are unaffected — they check their own prefix first and
# fall back to the default 4KB page size.
# Some aarch64 Linux hosts use 64KB kernel pages = 2^16; set the matching
# env vars below for those platforms.
# See: https://github.com/tikv/jemallocator/issues/122
[env]
# The ambient shell of a grok-agent session exports these, and the shell reads
# them through `env_string`/`env_bool`, where blank means unset. Left alone, an
# interactive dev shell makes hundreds of env-sensitive shell tests fail (OTLP
# header parsing, endpoint precedence, catalog shape). `force` is required
# because cargo leaves an already-set variable alone.
GROK_EXTERNAL_OTEL = { value = "", force = true }
OTEL_EXPORTER_OTLP_ENDPOINT = { value = "", force = true }
OTEL_EXPORTER_OTLP_TRACES_ENDPOINT = { value = "", force = true }
OTEL_EXPORTER_OTLP_HEADERS = { value = "", force = true }
OTEL_LOGS_EXPORTER = { value = "", force = true }
OTEL_METRICS_EXPORTER = { value = "", force = true }
OTEL_TRACES_EXPORTER = { value = "", force = true }
# Same story for provider keys: tests that remove a stored key still see the
# provider as configured when the ambient shell exports these, so they assert
# `NotConfigured` and get `Configured`. A test that needs a key sets its own.
ANTHROPIC_API_KEY = { value = "", force = true }
OPENAI_API_KEY = { value = "", force = true }
OPENROUTER_API_KEY = { value = "", force = true }
XAI_API_KEY = { value = "", force = true }
# Under nextest's parallelism, hundreds of tests that build an S3 client panic
# in aws-smithy's rustls provider: "TrustStore configured to enable native roots
# but no valid root certificates parsed!" — the native-roots loader comes back
# empty when many processes load it at once. `rustls-native-certs` honours
# SSL_CERT_FILE, and pointing it at the system bundle makes the same 50-test
# module go from ~47 failures to 1. macOS path; a Linux host would use
# /etc/ssl/certs/ca-certificates.crt.
SSL_CERT_FILE = { value = "/etc/ssl/cert.pem", force = true }
SYSTEM_DEPS_DAV1D_BUILD_INTERNAL = "auto"
AARCH64_APPLE_DARWIN_JEMALLOC_SYS_WITH_LG_PAGE = "14"
AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE = "16"
AARCH64_UNKNOWN_LINUX_MUSL_JEMALLOC_SYS_WITH_LG_PAGE = "16"
AARCH64_UNKNOWN_LINUX_MUSL_JEMALLOC_SYS_WITH_BACKGROUND_THREADS = "0"
