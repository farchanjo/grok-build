# Repository-level nextest configuration.
#
# cargo-nextest is the preferred fast local test runner. This file keeps the
# default profile conservative: tests must finish quickly, failures are shown
# clearly, and retries are disabled so flaky tests surface instead of being
# hidden by re-runs.
#
# For crate-targeted runs from the canonical isolated profile:
#   export GROK_HOME="${HOME}/.grokdev"
#   cargo nextest run -p xai-grok-shell
#
# To include ignored acceptance/perf tests:
#   cargo nextest run -p xai-grok-shell --run-ignored all
#
# `cargo test` compatibility is preserved; `cargo test` simply ignores this file.

# Static nextest store path. These paths are resolved relative to the workspace
# root and are not dynamically altered by a caller-provided CARGO_TARGET_DIR
# override. In verified cargo-nextest 0.9.137, environment-variable syntax here
# is not interpolated (it was literally used as a directory name), so keep the
# path static. If you deliberately want nextest output elsewhere, pass a custom
# --config-file or edit this value directly.
[store]
dir = "target-dev/nextest"

[profile.default]
# Zero retries: if a test is flaky, re-running it silently hides the defect.
retries = 0

# Mark tests that take longer than this as SLOW, then enforce a 300s
# per-test ceiling by terminating after three slow periods.
slow-timeout = { period = "100s", terminate-after = 3 }

# Show skipped tests too so it is obvious when an important family is missing.
status-level = "skip"

# Only summarize failures; keep successful output from flooding the terminal.
final-status-level = "fail"

# These tests build a TLS client against the platform trust store. Run with the
# full parallelism, 13 of them panic in the rustls provider
# ("TrustStore configured to enable native roots but no valid root certificates
# parsed!") at about 15s; run one at a time they all pass, so the trigger is
# concurrency and not code. The group serializes only this family — everything
# else keeps the machine's parallelism.
[test-groups.platform-trust]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(laziness_integration_tests)'
test-group = 'platform-trust'

# Three end-to-end tests spawn a real process and complete a turn: about 80s
# each on an idle machine, so the default 300s cap is crossed once the whole
# suite runs them alongside 7600 other tests. They pass in isolation; widen the
# cap for this family instead of leaving the outcome to scheduling luck.
[[profile.default.overrides]]
filter = 'test(agent_headless_completes_a_turn_without_a_grok_session) | test(session_still_relays_when_the_switch_is_on) | test(xai_switch_keeps_the_relay_off_with_a_session_present)'
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.default.junit]
# Path is interpreted relative to ${store.dir}/${profile}. With the store above,
# reports are written to target-dev/nextest/default/nextest-results.xml.
# cargo-nextest 0.9.137 does not interpolate environment variables here, so do
# not rely on ${CARGO_TARGET_DIR} or similar syntax.
path = "nextest-results.xml"
