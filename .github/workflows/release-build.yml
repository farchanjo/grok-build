# Release build for the fcustom distribution targets.
#
# Triggers:
#   - push to `fcustom`        -> one generic proof-of-build per OS, artifacts
#                                 DISCARDED after 1 day, no GitHub Release.
#   - push/create of tag `v*`  -> full CPU-variant matrix (see below), then
#                                 create/refresh the GitHub Release for that
#                                 tag with all binaries as assets. Tags
#                                 cannot be `git push`ed to this remote
#                                 (server hook allows only fcustom ->
#                                 fcustom); create the remote tag via API:
#                                   gh api repos/farchanjo/grok-build/git/refs \
#                                     -f ref=refs/tags/vX.Y.Z-fcustom \
#                                     -f sha=$(git rev-list -n1 vX.Y.Z-fcustom)
#   - workflow_dispatch        -> generic builds (artifact only, no release).
#                                 Input `runners` forces the pool.
#
# Runners: releases build on the self-hosted grok-* runners (this Mac for
# macOS, `l-agent-lnx` on psc for Linux, `gha-runner-win` on psc for Windows),
# so a release does not depend on GitHub-hosted capacity or the release-asset
# CDN. Branch pushes stay on the hosted images: ephemeral, parallel, and they
# never occupy the development machines. A manual dispatch with
# `runners: self-hosted` exercises the self-hosted path without cutting a tag.
# The hosted labels stay in the matrix as the fallback pool.
#
# CPU variants per operating system, published as grok-<target>-<variant>:
#   macOS  aarch64: m1 (apple-a17 core lineage = M1/M2/M3), m4, generic
#   macOS  x86_64:  intel (baseline x86-64: runs on every Intel Mac, including
#                   pre-AVX2 2010-2012 models, which a haswell/skylake tuning
#                   would SIGILL on). Cross-compiled on the arm64 macos-15
#                   runner, so it is release-only to keep pushes at three jobs.
#   Linux  x86_64:  zen4 (AMD znver4), intel (Alder Lake), generic
#   Windows x86_64: zen4, intel, generic
# A job-level `if` cannot read `matrix`, so the `prepare` job builds the JSON
# matrix instead: pushes build only the generic variants, tags build all of
# them.
#
# rustflags are NOT additive: setting RUSTFLAGS replaces the .cargo/config.toml
# per-target list, so each variant starts from its target's base flags verbatim
# (linker, unwind tables, -ObjC, crt-static) and only appends -C target-cpu.
# The build passes --target explicitly: without it, RUSTFLAGS also applies to
# build scripts and proc macros running on the runner at build time, and a
# znver4 (AVX-512) build script SIGILLs on the runner CPU. With --target,
# host artifacts stay runner-native while target artifacts get the tuning.
#
# `protoc` resolution is handled by `xai-proto-build` (see
# `crates/build/xai-proto-build/src/find_protoc.rs`): GitHub-hosted Linux and
# macOS runners use the DotSlash wrapper or a system `protoc`; Windows has no
# DotSlash platform entry, so the job puts a matching `protoc` on PATH.

name: Release build

on:
  push:
    branches:
      - fcustom
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      runners:
        description: "Runner pool: self-hosted uses the grok-* runners, hosted uses the GitHub images"
        type: choice
        options:
          - self-hosted
          - hosted
        default: self-hosted

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  # Branch builds are throwaway proof-of-build runs: the newest push wins
  # and cancels an older in-flight branch run. Tag/release runs are never
  # cancelled mid-flight.
  cancel-in-progress: ${{ github.ref == 'refs/heads/fcustom' }}

jobs:
  # Emit the build matrix. Every push proves the tree still builds once per OS
  # (generic codegen, cheap); a tag additionally builds every CPU-tuned
  # variant that the release publishes.
  prepare:
    name: Select build variants
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        name: Build matrix JSON
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          # Releases run on the self-hosted grok-* runners; branch pushes stay on
          # the hosted images (ephemeral, parallel, and they never occupy the
          # development machines). A manual dispatch can force either pool.
          RUNNERS: ${{ inputs.runners || (startsWith(github.ref, 'refs/tags/') && 'self-hosted' || 'hosted') }}
        shell: bash
        run: |
          # One table; release_only rows are kept only for tag refs.
          # Modern LLVM (pinned 1.97.1) has no apple-m1/m2/m3 names; that
          # core lineage is apple-a17 (M1/M2/M3 all build on it). rustflags
          # repeat each target's .cargo/config.toml base flags verbatim
          # (they are not additive) and append -C target-cpu for the variant.
          matrix=$(jq -nc \
            --arg d '-C link-arg=-undefined -C link-arg=dynamic_lookup -C force-unwind-tables=yes -C link-args=-ObjC' \
            --arg l '-C force-unwind-tables=yes -C link-arg=-fuse-ld=lld' \
            --arg w '-C force-unwind-tables=yes -C target-feature=+crt-static' '
            [
              {variant:"generic", os:"macos-15",      target:"aarch64-apple-darwin",      ext:"",     release_only:false, rustflags:$d},
              {variant:"generic", os:"ubuntu-24.04",  target:"x86_64-unknown-linux-gnu",  ext:"",     release_only:false, rustflags:$l},
              {variant:"generic", os:"windows-2025",  target:"x86_64-pc-windows-msvc",    ext:".exe", release_only:false, rustflags:$w},
              {variant:"m1",      os:"macos-15",      target:"aarch64-apple-darwin",      ext:"",     release_only:true,  rustflags:"\($d) -C target-cpu=apple-a17"},
              {variant:"m4",      os:"macos-15",      target:"aarch64-apple-darwin",      ext:"",     release_only:true,  rustflags:"\($d) -C target-cpu=apple-m4"},
              {variant:"intel",   os:"macos-15",      target:"x86_64-apple-darwin",       ext:"",     release_only:true,  rustflags:$d},
              {variant:"zen4",    os:"ubuntu-24.04",  target:"x86_64-unknown-linux-gnu",  ext:"",     release_only:true,  rustflags:"\($l) -C target-cpu=znver4"},
              {variant:"intel",   os:"ubuntu-24.04",  target:"x86_64-unknown-linux-gnu",  ext:"",     release_only:true,  rustflags:"\($l) -C target-cpu=alderlake"},
              {variant:"zen4",    os:"windows-2025",  target:"x86_64-pc-windows-msvc",    ext:".exe", release_only:true,  rustflags:"\($w) -C target-cpu=znver4"},
              {variant:"intel",   os:"windows-2025",  target:"x86_64-pc-windows-msvc",    ext:".exe", release_only:true,  rustflags:"\($w) -C target-cpu=alderlake"}
            ]
            | if $ENV.IS_TAG == "true" then . else map(select(.release_only | not)) end
            | if $ENV.RUNNERS == "self-hosted"
              then map(.os = ({ "macos-15": "grok-macos", "ubuntu-24.04": "grok-linux", "windows-2025": "grok-windows" }[.os]))
              else . end
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected $(printf '%s' "$matrix" | jq 'length') build variants:"
          printf '%s' "$matrix" | jq -r '.[] | "  \(.target) (\(.variant)) on \(.os)"'

  build:
    name: Build ${{ matrix.target }} (${{ matrix.variant }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # .cargo/config.toml sets sccache as the rustc wrapper; GitHub runners
      # are ephemeral, so a wrapper without a persistent cache only adds
      # overhead. Empty string disables it for this run.
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
      # Optional mirror for the ripgrep release asset, set as a repository
      # variable (e.g. http://<mirror>/github/BurntSushi/ripgrep/releases/download).
      # An unset variable renders as empty, which both build scripts read as
      # "use the public GitHub URL"; they also fall back to it when the mirror
      # fails, and retry the CDN three times per base.
      GROK_SHELL_RG_DOWNLOAD_BASE: ${{ vars.GROK_RG_DOWNLOAD_BASE }}
      GROK_TOOLS_RG_DOWNLOAD_BASE: ${{ vars.GROK_RG_DOWNLOAD_BASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure rustup is available
        # The self-hosted grok-* runners are development machines: nothing
        # guarantees rustup is installed or on the runner's PATH, and the very
        # next step is the first thing every job runs. Hosted images ship it, so
        # this is a no-op there. A tag build routed to self-hosted failed on
        # every job with `rustup: command not found` before this existed.
        shell: bash
        run: |
          # The runner reads GITHUB_PATH itself, so a Windows job needs the
          # native path form, not git-bash's /c/... form. Put the cargo bin dir
          # on PATH unconditionally: a runner may already have rustup installed
          # there and merely be missing the PATH entry, which is cheaper to fix
          # than to reinstall.
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if command -v cygpath >/dev/null 2>&1; then
            cargo_bin="$(cygpath -w "$cargo_bin")"
          fi
          echo "$cargo_bin" >> "$GITHUB_PATH"

          if [ -x "$cargo_bin/rustup" ] || [ -x "$cargo_bin/rustup.exe" ] \
             || command -v rustup >/dev/null 2>&1; then
            echo "rustup already available ($cargo_bin)"
            exit 0
          fi

          echo "rustup not found; bootstrapping"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          # Under git-bash the installer infers a *-gnu host tuple, while every
          # Windows job builds --target *-msvc; without pinning it, rustup
          # installs a std the build cannot use. RUSTUP_INIT_SKIP_PATH_CHECK
          # silences the "cannot install while Rust is installed" refusal on a
          # machine that has Rust from elsewhere.
          host_flag=""
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) host_flag="--default-host x86_64-pc-windows-msvc" ;;
          esac
          RUSTUP_INIT_SKIP_PATH_CHECK=yes \
            sh "$RUNNER_TEMP/rustup-init.sh" -y --no-modify-path --profile minimal \
              --default-toolchain none $host_flag

      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          # rust-toolchain.toml names a bare channel, so every rustup shim
          # resolves it through default_host_tuple — and on a Windows runner that
          # tuple is inferred as *-gnu from the git-bash environment. The matrix
          # builds --target *-msvc, so a gnu-resolved toolchain has no std for it
          # and the build dies with `can't find crate for core`. Pin the host
          # before installing; this is the tuple the shims will use, so it also
          # covers the `rust-toolchain.toml` lookup itself.
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) rustup set default-host x86_64-pc-windows-msvc ;;
          esac
          channel="$(awk -F'"' '/^[[:space:]]*channel/{print $2}' rust-toolchain.toml)"
          echo "Installing pinned toolchain: $channel"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          rustup show

      - name: Add the macOS cross target
        # macos-15 runners are arm64: the x86_64 row is cross-compiled. The
        # target is also pinned in rust-toolchain.toml; this keeps the job
        # deterministic if that file ever stops declaring it.
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Install Linux linker and protobuf dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld protobuf-compiler

      - name: Install macOS protobuf compiler
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Same protoc the DotSlash wrapper pins (bin/protoc has no Windows
          # platform entry, and find_protoc falls through to PATH when the
          # wrapper is not executable).
          $root = Join-Path $env:RUNNER_TEMP 'protoc'
          Invoke-WebRequest `
            -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip' `
            -OutFile "$env:RUNNER_TEMP\protoc.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\protoc.zip" -DestinationPath $root
          Join-Path $root 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $root 'bin\protoc.exe') --version

      - name: Build release-dist
        # --target is what keeps CPU tuning safe: RUSTFLAGS then applies only
        # to target artifacts, while host artifacts (build scripts, proc
        # macros — they execute on the runner during the build) compile with
        # the runner-native CPU. Without it a znver4/alderlake build script
        # SIGILLs on the runner CPU (observed on proc-macro2). RUSTFLAGS
        # replaces (does not extend) the .cargo/config.toml target rustflags;
        # matrix.rustflags already repeats those base flags per target.
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --target ${{ matrix.target }} -p xai-grok-pager-bin --profile release-dist --locked

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          # The shipped binary keeps its real name: `grok` (`.exe` on
          # Windows), matching the deployed /opt/grok-custom/grok, never a
          # fork-variant name. The CPU variant lives in the artifact/asset
          # name, not in the binary name.
          cp "target/${{ matrix.target }}/release-dist/xai-grok-pager${{ matrix.ext }}" "dist/grok${{ matrix.ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "grok${{ matrix.ext }}" > "grok${{ matrix.ext }}.sha256")
          else
            (cd dist && shasum -a 256 "grok${{ matrix.ext }}" > "grok${{ matrix.ext }}.sha256")
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact (run-scoped) names carry target + CPU variant to avoid
          # collisions; the files inside are always `grok` + `grok.sha256`.
          # The release job renames them to `grok-<target>-<variant>` when
          # publishing assets.
          name: grok-${{ matrix.target }}-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          # Branch/dispatch builds are transient proof-of-build binaries:
          # auto-discard after 1 day. Tag releases are copied into the
          # persistent GitHub Release assets by the `release` job below.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 5 || 1 }}

  release:
    # Publish a GitHub Release only for tag builds; branch and manual runs
    # stop at the artifact above (build happens, binaries get discarded).
    name: Publish release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'grok-*'
          path: blobs

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          for dir in blobs/grok-*; do
            name="$(basename "$dir")"   # grok-<target>-<variant>
            # Windows artifacts carry `grok.exe`; POSIX ones carry `grok`.
            if [ -f "$dir/grok.exe" ]; then
              cp "$dir/grok.exe" "dist/${name}.exe"
            else
              cp "$dir/grok" "dist/${name}"
            fi
          done
          # Checksums are computed against the final asset names.
          (cd dist && for f in grok-*; do
             case "$f" in *.sha256) continue ;; esac
             sha256sum "$f" > "$f.sha256"
           done)
          ls -la dist/

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ github.ref_name }}"
        shell: bash
        run: |
          ls -la dist/
          # Re-runs on the same tag must not fail: refresh assets instead.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Every fcustom tag carries the -fcustom marker by convention
            # (vX.Y.Z-fcustom); that is the fork identity, not a pre-release
            # stage, so releases are always created as plain releases and
            # the assets keep the real shipped binary name (`grok`).
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Grok Build $TAG" \
              --generate-notes
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
