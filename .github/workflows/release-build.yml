# Release build for the fcustom distribution targets.
#
# Triggers:
#   - push to `fcustom`        -> build + smoke, artifacts DISCARDED (short
#                                 retention), no GitHub Release published.
#   - push/create of tag `v*`  -> build, then create/refresh the GitHub
#                                 Release for that tag with the binaries as
#                                 assets. Tags cannot be `git push`ed to this
#                                 remote (server hook allows only
#                                 fcustom -> fcustom); create the remote tag
#                                 via the API instead:
#                                   gh api repos/farchanjo/grok-build/git/refs \
#                                     -f ref=refs/tags/vX.Y.Z-fcustom \
#                                     -f sha=$(git rev-list -n1 vX.Y.Z-fcustom)
#   - workflow_dispatch        -> manual build (artifact only, no release).
#
# Produces three release-dist binaries (see `[profile.release-dist]` in the
# root Cargo.toml):
#   - aarch64-apple-darwin (macOS arm64, unsigned)
#   - x86_64-unknown-linux-gnu (Linux glibc, like the /opt/grok-custom deploy)
#   - x86_64-pc-windows-msvc (static CRT per .cargo/config.toml)
#
# `protoc` resolution is handled by `xai-proto-build` (see
# `crates/build/xai-proto-build/src/find_protoc.rs`): GitHub-hosted Linux and
# macOS runners use the DotSlash wrapper or a system `protoc`; Windows has no
# DotSlash platform entry, so the job puts a matching `protoc` on PATH.

name: Release build

on:
  push:
    branches:
      - fcustom
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ''
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    env:
      # .cargo/config.toml sets sccache as the rustc wrapper; GitHub runners
      # are ephemeral, so a wrapper without a persistent cache only adds
      # overhead. Empty string disables it for this run.
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel="$(awk -F'"' '/^[[:space:]]*channel/{print $2}' rust-toolchain.toml)"
          echo "Installing pinned toolchain: $channel"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux linker and protobuf dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld protobuf-compiler

      - name: Install macOS protobuf compiler
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Same protoc the DotSlash wrapper pins (bin/protoc has no Windows
          # platform entry, and find_protoc falls through to PATH when the
          # wrapper is not executable).
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip' `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'protoc')
          "$((Join-Path $env:RUNNER_TEMP 'protoc')\bin)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $env:RUNNER_TEMP 'protoc\bin\protoc.exe') --version

      - name: Build release-dist
        run: cargo build -p xai-grok-pager-bin --profile release-dist --locked

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          # The shipped binary keeps its real name: `grok` (`.exe` on
          # Windows), matching the deployed /opt/grok-custom/grok, never a
          # fork-variant name.
          cp "target/release-dist/xai-grok-pager${{ matrix.ext }}" "dist/grok${{ matrix.ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "grok${{ matrix.ext }}" > "grok${{ matrix.ext }}.sha256")
          else
            (cd dist && shasum -a 256 "grok${{ matrix.ext }}" > "grok${{ matrix.ext }}.sha256")
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact (run-scoped) names keep the target to avoid collisions;
          # the files inside are always `grok` + `grok.sha256`. The release
          # job renames them to `<artifact-name>` when publishing assets.
          name: grok-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          # Branch/dispatch builds are transient proof-of-build binaries:
          # auto-discard after 1 day. Tag releases are copied into the
          # persistent GitHub Release assets by the `release` job below.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 5 || 1 }}

  release:
    # Publish a GitHub Release only for tag builds; branch and manual runs
    # stop at the artifact above (build happens, binaries get discarded).
    name: Publish release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'grok-*'
          path: blobs

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          for dir in blobs/grok-*; do
            name="$(basename "$dir")"          # grok-<target>
            cp "$dir/grok" "dist/${name}"       # one asset per platform
            cp "$dir/grok.sha256" "dist/${name}.sha256" 2>/dev/null || true
          done
          ls -la dist/

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ github.ref_name }}"
        shell: bash
        run: |
          ls -la dist/
          # Re-runs on the same tag must not fail: refresh assets instead.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Every fcustom tag carries the -fcustom marker by convention
            # (vX.Y.Z-fcustom); that is the fork identity, not a pre-release
            # stage, so releases are always created as plain releases and
            # the assets keep the real shipped binary name (`grok`).
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Grok Build $TAG" \
              --generate-notes
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
